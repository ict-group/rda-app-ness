name: Build Ionic Capacitor App PROD
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'

      - name: Load .env
        run: |
          source .env
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Install Ionic and Capacitor CLI
        run: npm install -g @ionic/cli @capacitor/cli

      - name: Install npm dependencies
        run: npm ci

      - name: Check Android Platform
        run: if [ ! -d "android" ]; then echo "Android platform not found, exiting"; exit 1; fi

      - name: Build Ionic
        run: ionic build

      - name: Sync Android
        run: npx cap sync android

      - name: Splash Screens and Icons
        run: npx capacitor-assets generate

      - name: Build Ionic App
        run: ionic build --release --prod

      - name: Set version App
        run: |
          sed -i "s/versionCode.*/versionCode ${{ env.VERSION_CODE }}/g" android/app/build.gradle
          sed -i "s/versionName.*/versionName \"${{ env.VERSION_NAME }}\"/g" android/app/build.gradle

      - name: Build Android APK and AAB
        run: |
          cd android
          ./gradlew assembleRelease
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Sign APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY}}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Sign AAB
        id: sign_bundle
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY}}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename signed APK
        run: mv ${{ steps.sign_app.outputs.signedReleaseFile }} android/app/build/outputs/apk/release/rda-app-${{ env.VERSION_NAME }}_${{ env.VERSION_CODE }}.apk

      - name: Upload signed app apk
        uses: actions/upload-artifact@v4
        with:
          name: rda-app-${{ env.VERSION_NAME }}_${{ env.VERSION_CODE }}
          path: android/app/build/outputs/apk/release/rda-app-${{ env.VERSION_NAME }}_${{ env.VERSION_CODE }}.apk

      - name: Upload signed app bundle
        uses: actions/upload-artifact@v4
        with:
          name: rda-app-bundle-${{ env.VERSION_NAME }}_${{ env.VERSION_CODE }}
          path: ${{ steps.sign_bundle.outputs.signedReleaseFile }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ github.ref_name }}-v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}"
          release_name: "Release ${{ github.ref_name }} ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})"
          body: "Release notes for version ${{ github.ref_name }} ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})"
          files: |
            android/app/build/outputs/apk/release/rda-app-${{ env.VERSION_NAME }}_${{ env.VERSION_CODE }}.apk
            ${{ steps.sign_bundle.outputs.signedReleaseFile }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
