<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RDA App Ness</title>

    <base href="/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>

  <body>
    <app-root></app-root>
    <!--
      Richiesto da @capacitor-community/sqlite per il supporto SQLite su web (non nativo).
      Lo script che definisce questo custom element viene iniettato a runtime da
      DatabaseService (non qui): un <script type="module"> scritto direttamente in questo
      file viene trattato da Vite, in dev-server, come parte del proprio grafo di moduli
      per l'HMR, e il tentativo di "pre-transform" fallisce in modo incostante invece di
      servirlo come semplice asset statico.
    -->
    <jeep-sqlite></jeep-sqlite>
  </body>
</html>
